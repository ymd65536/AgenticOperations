server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/html;
    index index.html;

    location = /health {
        default_type text/plain;
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
