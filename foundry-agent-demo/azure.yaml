# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
    extensions:
        azure.ai.agents: '>=0.1.0-preview'
name: ai-foundry-starter-basic
services:
    ai-project-agenticops-demo:
        project: ""
        host: azure.ai.project
        language: ""
        endpoint: https://ai-account-rttl3zvneaqhm.services.ai.azure.com/api/projects/ai-project-agenticops-demo
        deployments:
            - name: gpt-4o-mini
              model:
                  format: OpenAI
                  name: gpt-4o-mini
                  version: '2024-07-18'
              sku:
                  name: GlobalStandard
                  capacity: 1
    service-recovery-agent:
        project: ./src/hosted-agent
        host: azure.ai.agent
        language: python
        uses:
            - ai-project-agenticops-demo
        codeConfiguration:
            dependencyResolution: remote_build
            entryPoint: main.py
            runtime: python_3_13
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
        kind: hosted
        name: service-recovery-agent
        protocols:
            - protocol: responses
              version: 2.0.0
        environmentVariables:
            - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
              value: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
infra:
    provider: bicep
    path: ./infra
