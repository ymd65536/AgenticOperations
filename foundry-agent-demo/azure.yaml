# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
    extensions:
        azure.ai.agents: '>=0.1.0-preview'
name: ai-foundry-starter-basic
services:
    ai-project-agenticops-demo:
        project: ""
        host: azure.ai.project
        language: ""
        endpoint: ${AZURE_AI_PROJECT_ENDPOINT}
        deployments:
            - name: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
              model:
                  format: OpenAI
                  name: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
                  version: '2025-08-07'
              sku:
                  name: Standard
                  capacity: 1
    service-recovery-agent:
        project: ./src/hosted-agent
        host: azure.ai.agent
        language: python
        uses:
            - ai-project-agenticops-demo
        codeConfiguration:
            dependencyResolution: remote_build
            entryPoint: main.py
            runtime: python_3_13
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
        kind: hosted
        name: service-recovery-agent
        protocols:
            - protocol: responses
              version: 2.0.0
        environmentVariables:
            - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
              value: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
            - name: HTTP_PROBE_ENDPOINT
              value: ${HTTP_PROBE_ENDPOINT}
infra:
    provider: bicep
    path: ./infra
